name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Works no matter where pom.xml ended up (repository root or inside a folder you uploaded)
      - name: Find the project
        id: project
        shell: bash
        run: |
          POM=$(find . -maxdepth 3 -name pom.xml | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::No pom.xml found. Upload the whole project (pom.xml, src, README.md) to the repository."
            exit 1
          fi
          echo "Project folder: $(dirname "$POM")"
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - name: Build the plugin
        shell: bash          # bash with pipefail, so a failing Maven build fails this step even with tee
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -o pipefail
          mvn -B -ntp -e clean package 2>&1 | tee build.log

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: VPerPlayerKit
          path: ${{ steps.project.outputs.dir }}/target/VPerPlayerKit-2.1.0.jar
          if-no-files-found: error

      # If the build failed, the full Maven output is saved here (also visible in the log above)
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.project.outputs.dir }}/build.log
          if-no-files-found: ignore
